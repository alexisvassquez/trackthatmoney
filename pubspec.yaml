name: track_that_money
description: "An Expense Tracking App to Know Why You're Broke."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  uuid: ^4.0.0
  flutter:
    sdk: flutter
  go_router: ^17.0.1
  shared_preferences: ^2.3.2
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Networking
  http: ^1.2.0
  url_launcher: ^6.3.2

  # ENV secrets
  flutter_dotenv: ^6.0.1

  # UI
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  fl_chart: ^1.3.0

  # Auth
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.15
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true
  assets:
    - lib/data/resources_library.json
    - assets/animations/
    - .env
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Italic.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800 
